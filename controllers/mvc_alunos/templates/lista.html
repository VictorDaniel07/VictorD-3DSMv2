<html>
<body>
    <h2>Lista de Alunos</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Ações</th>
        </tr>
        {% for aluno in alunos %}
        <tr>
            <td>{{ aluno[0] }}</td>
            <td>{{ aluno[1] }}</td>
            <td>{{ aluno[2] }}</td>
            <td>
                <a href="/aluno/deletar/{{ aluno[0] }}">Apagar</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Cadastrar novo aluno</a>
</body>
</html>
